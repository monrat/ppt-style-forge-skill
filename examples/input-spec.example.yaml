# input-spec — describes the INPUTS to the ppt-style-forge workflow itself.
#
# This is NOT the generator's input. It tells the forge skill what raw materials
# (templates + brand guidance) to turn into a NEW brand skill. Think of it as a
# project brief for "build me a brand skill from these".
#
# Contrast with deck-spec.example.yaml, which is the generator's input: it says
# how to build ONE deck (per-slide layout + fields) once a brand skill exists.
#
# Both are valid; they operate at different levels:
#   input-spec  -> forge skill  -> brand skill (e.g. <brand>-ppt-style)
#   deck-spec   -> generate_deck.py -> one .pptx

project: example-brand-ppt-style
brand_name: Example Brand
inputs:
  templates:
    - path: templates/Example_Report_Template.pptx
      use: report / dense evidence-led decks
    - path: templates/Example_Live_Template.pptx
      use: live / keynote decks
  brand_guidance:
    - path_or_url: brand-book.pdf
    - path_or_url: https://example.com/brand-guidelines
outputs:
  skill_name: example-ppt-style
  generated_deck_sample: out/example-sample.pptx
requirements:
  preserve_master: true
  preserve_theme: true
  no_freehand_layouts: true
  visual_qa_renderer: PowerPoint or LibreOffice, name explicitly
